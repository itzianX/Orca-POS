<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="480" height="360" role="img" aria-label="ORCA mascot, a chibi killer whale" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="orcaBodyClip">
      <path id="orcaBody" d="M3 53C5 36 22 20 44 20C52 20 58 21 64 22C78 26 90 33 98 39L100 45C90 56 76 72 56 76C32 78 10 70 3 53Z"/>
    </clipPath>
  </defs>
  <!-- bubbles -->
  <circle cx="14" cy="14" r="2.4" fill="#7ab8dc" opacity=".8"/><circle cx="22" cy="7" r="1.6" fill="#7ab8dc" opacity=".6"/>
  <!-- dorsal fin (tall, pointed, swept back) -->
  <path d="M58 25C61 15 68 8 78 2C77 12 81 21 88 30Z" fill="#0b1120" stroke="#7ab8dc" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- tail flukes -->
  <path d="M96 38C102 31 108 25 115 22C112 30 112 36 108 42C113 47 115 53 117 60C108 55 101 50 97 46Z" fill="#0b1120" stroke="#7ab8dc" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- body: black base, white underside + flank lobe, grey saddle -->
  <use href="#orcaBody" fill="#0b1120"/>
  <g clip-path="url(#orcaBodyClip)">
    <path d="M0 57C14 58 30 66 46 63C60 60 72 54 84 42C88 48 92 54 108 50L120 52L120 90L0 90Z" fill="#fff"/>
    <path d="M66 24C74 24 84 28 92 34C84 38 74 37 67 34Z" fill="#94a3b8" opacity=".6"/>
  </g>
  <use href="#orcaBody" fill="none" stroke="#7ab8dc" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- pectoral flipper -->
  <path d="M44 62C54 62 62 70 60 80C52 78 44 72 44 62Z" fill="#0b1120" stroke="#7ab8dc" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- white eyepatch -->
  <ellipse cx="40" cy="33" rx="11" ry="5" transform="rotate(-25 40 33)" fill="#fff"/>
  <!-- eye -->
  <circle cx="23" cy="46" r="6.5" fill="#fff"/><circle cx="24" cy="47" r="4.2" fill="#0b1120"/>
  <circle cx="25.6" cy="45.2" r="1.6" fill="#fff"/><circle cx="22.6" cy="48.6" r=".8" fill="#fff"/>
  <!-- blush + smile -->
  <ellipse cx="14" cy="55" rx="3.5" ry="2.3" fill="#fb7185" opacity=".8"/>
  <path d="M9 61Q16 67 27 63" fill="none" stroke="#0b1120" stroke-width="2" stroke-linecap="round"/>
</svg>
