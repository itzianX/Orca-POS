<!DOCTYPE html>
<html lang="en" data-theme="abyss">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ORCA Store POS</title>
  <meta name="theme-color" content="#0b1120">
  <meta name="description" content="ORCA Store POS — offline point of sale for your store">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ORCA POS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="splash" class="splash" aria-hidden="true"><svg class="splash-orca bob" viewBox="0 0 120 90"><use href="#orcaCute" /></svg></div>
  <!-- shared orca logo -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="orca" viewBox="0 0 40 40">
      <path d="M8 24 C12 16 20 13 28 15 L30 10 L32 16 C34 18 35 21 34 23 C32 26 24 29 16 28 L14 31 L11 27 C9 26 8 25 8 24 Z" fill="#fff" />
      <ellipse cx="15" cy="25" rx="5" ry="2.5" fill="#0b1120" />
      <circle cx="16" cy="19" r="1.5" fill="#0b1120" />
    </symbol>
  </svg>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="orcaCute" viewBox="0 0 120 90">
<defs>
    <clipPath id="orcaBodyClip">
      <path id="orcaBody" d="M3 53C5 36 22 20 44 20C52 20 58 21 64 22C78 26 90 33 98 39L100 45C90 56 76 72 56 76C32 78 10 70 3 53Z"/>
    </clipPath>
  </defs>
  <!-- bubbles -->
  <circle cx="14" cy="14" r="2.4" style="fill:var(--accent,#7ab8dc)" opacity=".8"/><circle cx="22" cy="7" r="1.6" style="fill:var(--accent,#7ab8dc)" opacity=".6"/>
  <!-- dorsal fin (tall, pointed, swept back) -->
  <path d="M58 25C61 15 68 8 78 2C77 12 81 21 88 30Z" fill="#0b1120" style="stroke:var(--accent,#7ab8dc)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- tail flukes -->
  <path d="M96 38C102 31 108 25 115 22C112 30 112 36 108 42C113 47 115 53 117 60C108 55 101 50 97 46Z" fill="#0b1120" style="stroke:var(--accent,#7ab8dc)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- body: black base, white underside + flank lobe, grey saddle -->
  <use href="#orcaBody" fill="#0b1120"/>
  <g clip-path="url(#orcaBodyClip)">
    <path d="M0 57C14 58 30 66 46 63C60 60 72 54 84 42C88 48 92 54 108 50L120 52L120 90L0 90Z" fill="#fff"/>
    <path d="M66 24C74 24 84 28 92 34C84 38 74 37 67 34Z" fill="#94a3b8" opacity=".6"/>
  </g>
  <use href="#orcaBody" fill="none" style="stroke:var(--accent,#7ab8dc)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- pectoral flipper -->
  <path d="M44 62C54 62 62 70 60 80C52 78 44 72 44 62Z" fill="#0b1120" style="stroke:var(--accent,#7ab8dc)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- white eyepatch -->
  <ellipse cx="40" cy="33" rx="11" ry="5" transform="rotate(-25 40 33)" fill="#fff"/>
  <!-- eye -->
  <circle cx="23" cy="46" r="6.5" fill="#fff"/><circle cx="24" cy="47" r="4.2" fill="#0b1120"/>
  <circle cx="25.6" cy="45.2" r="1.6" fill="#fff"/><circle cx="22.6" cy="48.6" r=".8" fill="#fff"/>
  <!-- blush + smile -->
  <ellipse cx="14" cy="55" rx="3.5" ry="2.3" fill="#fb7185" opacity=".8"/>
  <path d="M9 61Q16 67 27 63" fill="none" stroke="#0b1120" stroke-width="2" stroke-linecap="round"/>
</symbol>
  </svg>

  <!-- ============ WELCOME (name only, no password) ============ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <div style="text-align:center;margin-bottom:26px;">
        <div class="logo-circle bob"><svg width="46" height="46"><use href="#orca" /></svg></div>
        <h1 class="brand-title">ORCA <span>STORE</span></h1>
        <p class="brand-sub">Who's on the counter?</p>
      </div>
      <div class="card auth-card">
        <div id="nameList" class="name-list"></div>
        <label class="field-label" for="nameInput">Your name</label>
        <input id="nameInput" type="text" placeholder="e.g. Maria" class="text-input" maxlength="16" autocomplete="off" autocapitalize="words" enterkeyhint="go">
        <p id="nameErr" class="error-msg">Please type a name to continue</p>
        <button id="nameGo" class="btn-primary bigbtn">Start Selling</button>
      </div>
      <p class="footer-note">No password needed. Every sale is tagged with your name, and data stays on this device.</p>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app" style="display:none;">
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="app-header">
      <div class="header-inner">
        <div class="header-left">
          <div class="logo-small"><svg width="26" height="26"><use href="#orca" /></svg></div>
          <div>
            <div class="header-brand">ORCA <span>STORE</span> <span id="netPill" class="net-pill" role="status" data-state="online"><i aria-hidden="true"></i><b>Online</b></span></div>
          </div>
        </div>
        <div class="header-right">
                    <button id="userChip" class="user-chip bigbtn" title="Settings">
            <span id="userAvatar" class="user-avatar">?</span>
            <span id="userName" class="user-name">Staff</span>
          </button>
          <button id="logoutBtn" class="icon-btn labeled bigbtn" title="Switch user" aria-label="Switch user">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg><span>Switch</span>
          </button>
        </div>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Main">
      <div class="nav-inner">
        <button class="navbtn active" data-view="store"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M4 9v11h16V9M9 13h6" /></svg>Sell</button>
        <button class="navbtn" data-view="add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" /></svg>Items</button>
        <button class="navbtn" data-view="utang"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.5 3.5-5.5 6.5-5.5s5.7 2 6.5 5.5" /><path d="M17 9l4 4M21 9l-4 4" /></svg>Utang</button>
        <button class="navbtn" data-view="history"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2" /></svg>Sales</button>
        <button class="navbtn" data-view="calc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" /><path d="M8 6h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01" /></svg>Calc</button>
      </div>
    </nav>

    <div id="checkoutBar" class="checkout-bar">
      <div class="checkout-inner">
        <button id="checkoutBtn" class="btn-checkout bigbtn">
          <span id="coCount">0 items</span><span id="coTotal">₱0.00 · Checkout</span>
        </button>
      </div>
    </div>

    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    /* UX helpers: connection status, install button, nav accessibility */
    (function () {
      var pill = document.getElementById('netPill');
      function setNet() {
        var on = navigator.onLine;
        pill.dataset.state = on ? 'online' : 'offline';
        pill.querySelector('b').textContent = on ? 'Online' : 'Offline';
        pill.title = on ? 'Connected. Sales also save on this device.' : 'No internet. Keep selling, sales save on this device.';
      }
      window.addEventListener('online', setNet);
      window.addEventListener('offline', setNet);
      setNet();


      var nav = document.querySelector('.bottom-nav');
      function sync() {
        nav.querySelectorAll('.navbtn').forEach(function (b) {
          if (b.classList.contains('active')) b.setAttribute('aria-current', 'page');
          else b.removeAttribute('aria-current');
        });
      }
      new MutationObserver(sync).observe(nav, { subtree: true, attributes: true, attributeFilter: ['class'] });
      sync();
    })();
  </script>
</body>

</html>
